<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stream Control Dashboard</title>
  
  <style>
    :root {
      --bg-dark: #0b0a0d;
      --bg-panel: #14131a;
      --bg-card: #1c1b24;
      --accent-purple: #9146ff;
      --accent-purple-hover: #772ce8;
      --status-live: #ff1744;
      --status-offline: #666666;
      --text-main: #efeff1;
      --text-muted: #adadb8;
      --border-color: #272533;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Header & Settings Bar */
    header {
      background-color: var(--bg-panel);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-area h1 {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--accent-purple);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      background: var(--bg-card);
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--status-offline);
    }

    .status-dot.live {
      background-color: var(--status-live);
      box-shadow: 0 0 8px var(--status-live);
    }

    .channel-input-group {
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent-purple);
    }

    button {
      background-color: var(--accent-purple);
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    button:hover {
      background-color: var(--accent-purple-hover);
    }

    /* Main Grid Layout */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 340px 300px;
      grid-template-rows: 1fr;
      gap: 12px;
      padding: 12px;
      flex: 1;
      height: calc(100vh - 60px);
    }

    @media (max-width: 1200px) {
      .dashboard-grid {
        grid-template-columns: 1fr 320px;
      }
      .right-panel {
        display: none;
      }
    }

    .panel {
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-header {
      padding: 10px 14px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Video Player & Chat Area */
    .player-container {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Tools & Notes Area */
    .panel-content {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      height: 100%;
    }

    textarea {
      width: 100%;
      height: 120px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px;
      border-radius: 6px;
      resize: vertical;
      font-size: 0.85rem;
      outline: none;
    }

    textarea:focus {
      border-color: var(--accent-purple);
    }

    .quick-links {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .quick-link-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.85rem;
      transition: border-color 0.2s;
    }

    .quick-link-btn:hover {
      border-color: var(--accent-purple);
    }

    .event-log {
      font-family: monospace;
      font-size: 0.8rem;
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      padding: 8px;
      border-radius: 6px;
      flex: 1;
      overflow-y: auto;
      color: var(--text-muted);
    }

    .event-entry {
      margin-bottom: 4px;
    }

    .event-time {
      color: var(--accent-purple);
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-area">
      <h1>Stream Control</h1>
      <div class="status-badge">
        <span id="status-dot" class="status-dot"></span>
        <span id="status-text">OFFLINE</span>
      </div>
    </div>
    <div class="channel-input-group">
      <input type="text" id="channel-input" placeholder="Channel Name" value="thelonewanderer2694">
      <button onclick="updateChannel()">Load</button>
    </div>
  </header>

  <main class="dashboard-grid">
    <!-- Stream Panel -->
    <section class="panel">
      <div class="panel-header">Stream Stream</div>
      <div class="player-container" id="player-container"></div>
    </section>

    <!-- Chat Panel -->
    <section class="panel">
      <div class="panel-header">Live Chat</div>
      <div class="player-container" id="chat-container"></div>
    </section>

    <!-- Toolkit Panel -->
    <section class="panel right-panel">
      <div class="panel-header">Quick Tools</div>
      <div class="panel-content">
        <textarea id="notes" placeholder="Quick stream notes..."></textarea>
        <div class="event-log" id="event-log">
          <div class="event-entry"><span class="event-time">[System]</span> Dashboard Ready</div>
        </div>
      </div>
    </section>
  </main>

  <script>
    var currentChannel = "thelonewanderer2694";

    function updateChannel() {
      var input = document.getElementById('channel-input').value.trim();
      if (input) {
        currentChannel = input;
        loadEmbeds(currentChannel);
      }
    }

    function loadEmbeds(channel) {
      var host = window.location.hostname || "localhost";
      
      var playerContainer = document.getElementById('player-container');
      playerContainer.innerHTML = '<iframe src="https://player.twitch.tv/?channel=' + channel + '&parent=' + host + '&autoplay=false" allowfullscreen></iframe>';

      var chatContainer = document.getElementById('chat-container');
      chatContainer.innerHTML = '<iframe src="https://www.twitch.tv/embed/' + channel + '/chat?parent=' + host + '&darkpopout"></iframe>';
    }

    window.addEventListener('DOMContentLoaded', function() {
      loadEmbeds(currentChannel);
    });
  </script>
</body>
</html>
