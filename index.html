<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twitch Streamer Dashboard</title>
  <style>
    :root {
      --bg-dark: #0f0e13;
      --bg-panel: #18171f;
      --bg-card: #1f1e29;
      --accent-purple: #9146ff;
      --accent-purple-hover: #772ce8;
      --text-main: #efeff1;
      --text-muted: #adadb8;
      --border-color: #2a2937;
      --status-live: #e53935;
      --status-offline: #757575;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Header & Settings Bar */
    header {
      background-color: var(--bg-panel);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-area h1 {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--accent-purple);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      background: var(--bg-card);
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--status-offline);
    }

    .status-dot.live {
      background-color: var(--status-live);
      box-shadow: 0 0 8px var(--status-live);
    }

    .channel-input-group {
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent-purple);
    }

    button {
      background-color: var(--accent-purple);
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    button:hover {
      background-color: var(--accent-purple-hover);
    }

    /* Main Grid Layout */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 340px 300px;
      grid-template-rows: 1fr;
      gap: 12px;
      padding: 12px;
      flex: 1;
      height: calc(100vh - 60px);
    }

    @media (max-width: 1200px) {
      .dashboard-grid {
        grid-template-columns: 1fr 320px;
      }
      .right-panel {
        display: none;
      }
    }

    .panel {
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-header {
      padding: 10px 14px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Video Player & Chat Area */
    .player-container {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Tools & Notes Area */
    .panel-content {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      height: 100%;
    }

    textarea {
      width: 100%;
      height: 120px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px;
      border-radius: 6px;
      resize: vertical;
      font-size: 0.85rem;
      outline: none;
    }

    textarea:focus {
      border-color: var(--accent-purple);
    }

    .quick-links {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .quick-link-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.85rem;
      transition: border-color 0.2s;
    }

    .quick-link-btn:hover {
      border-color: var(--accent-purple);
    }

    .event-log {
      font-family: monospace;
      font-size: 0.8rem;
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      padding: 8px;
      border-radius: 6px;
      flex: 1;
      overflow-y: auto;
      color: var(--text-muted);
    }

    .event-entry {
      margin-bottom: 4px;
    }

    .event-time {
      color: var(--accent-purple);
    }

  </style>
</head>
<body>

  <header>
    <div class="logo-area">
      <h1>Stream Control</h1>
      <div class="status-badge">
        <span id="status-dot" class="status-dot"></span>
        <span id="status-text">OFFLINE</span>
      </div>
    </div>
    
    <div class="channel-input-group">
      <input type="text" id="channel-input" placeholder="Twitch Username" value="thelonewanderer2694" />
      <button onclick="updateChannel()">Load Stream</button>
    </div>
  </header>

  <main class="dashboard-grid">
    <!-- Stream Preview Panel -->
    <section class="panel">
      <div class="panel-header">
        <span>Live Stream Feed</span>
        <span id="viewer-count" style="color: var(--text-muted); font-weight: normal; font-size: 0.85rem;">Viewers: --</span>
      </div>
      <div class="player-container" id="player-container">
        <!-- Embed loaded via JS -->
      </div>
    </section>

    <!-- Native Twitch Chat Panel -->
    <section class="panel">
      <div class="panel-header">
        <span>Twitch Chat</span>
      </div>
      <div class="player-container" id="chat-container">
        <!-- Chat Embed loaded via JS -->
      </div>
    </section>

    <!-- Streamer Utilities / Quick Tools -->
    <section class="panel right-panel">
      <div class="panel-header">
        <span>Streamer Toolkit</span>
      </div>
      <div class="panel-content">
        
        <div>
          <label style="font-size: 0.8rem; color: var(--text-muted); display: block; margin-bottom: 4px;">Session / Title Notes</label>
          <textarea id="stream-notes" placeholder="Draft stream titles, game categories, or game objectives here... (Saved automatically)"></textarea>
        </div>

        <div>
          <label style="font-size: 0.8rem; color: var(--text-muted); display: block; margin-bottom: 6px;">Quick Dashboards</label>
          <div class="quick-links">
            <a id="twitch-dashboard-link" href="#" target="_blank" class="quick-link-btn">
              <span>Twitch Creator Dashboard</span>
              <span>↗</span>
            </a>
            <a id="twitch-mod-link" href="#" target="_blank" class="quick-link-btn">
              <span>Mod View</span>
              <span>↗</span>
            </a>
          </div>
        </div>

        <div style="display: flex; flex-direction: column; flex: 1;">
          <label style="font-size: 0.8rem; color: var(--text-muted); display: block; margin-bottom: 4px;">Dashboard Activity Log</label>
          <div class="event-log" id="event-log">
            <div class="event-entry"><span class="event-time">[System]</span> Dashboard initialized.</div>
          </div>
        </div>

      </div>
    </section>
  </main>

  <script>
    let currentChannel = "thelonewanderer2694";

    // Load saved channel or notes from localStorage
    window.addEventListener('DOMContentLoaded', () => {
      const savedChannel = localStorage.getItem('twitch_dashboard_channel');
      if (savedChannel) {
        currentChannel = savedChannel;
        document.getElementById('channel-input').value = currentChannel;
      }
      
      const savedNotes = localStorage.getItem('twitch_dashboard_notes');
      if (savedNotes) {
        document.getElementById('stream-notes').value = savedNotes;
      }

      // Auto-save notes
      document.getElementById('stream-notes').addEventListener('input', (e) => {
        localStorage.setItem('twitch_dashboard_notes', e.target.value);
      });

      loadEmbeds(currentChannel);
    });

    function updateChannel() {
      const inputVal = document.getElementById('channel-input').value.trim();
      if (inputVal) {
        currentChannel = inputVal.toLowerCase();
        localStorage.setItem('twitch_dashboard_channel', currentChannel);
        loadEmbeds(currentChannel);
        logEvent(`Switched channel view to: ${currentChannel}`);
      }
    }

    function loadEmbeds(channel) {
      // GitHub Pages domain detection for iframe parent parameter
      const currentHost = window.location.hostname || "localhost";

      // Player Embed
      const playerContainer = document.getElementById('player-container');
      playerContainer.innerHTML = `
        <iframe 
          src="https://player.twitch.tv/?channel=${channel}&parent=${currentHost}&autoplay=false" 
          allowfullscreen>
        </iframe>`;

      // Chat Embed
      const chatContainer = document.getElementById('chat-container');
      chatContainer.innerHTML = `
        <iframe 
          src="https://www.twitch.tv/embed/${channel}/chat?parent=${currentHost}&darkpopout" 
          height="100%" 
          width="100%">
        </iframe>`;

      // Update Links
      document.getElementById('twitch-dashboard-link').href = `https://dashboard.twitch.tv/u/${channel}/stream-manager`;
      document.getElementById('twitch-mod-link').href = `https://www.twitch.tv/moderator/${channel}`;
    }

    function logEvent(message) {
      const log = document.getElementById('event-log');
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const entry = document.createElement('div');
      entry.className = 'event-entry';
      entry.innerHTML = `<span class="event-time">[${time}]</span> ${message}`;
      log.appendChild(entry);
      log.scrollTop = log.scrollHeight;
    }
  </script>
</body>
</html>
